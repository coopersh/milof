[project]
name = "milof"
version = "0.0.1"
description = "Vision-based inspection support for the Milouf poultry slaughter line"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
]

[project.optional-dependencies]
camera = ["pypylon"]
viewer = ["opencv-python"]  # GUI build; replaces opencv-python-headless
ui = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["acquisition", "labeling", "models", "review", "ui"]

[tool.setuptools.package-data]
ui = ["static/*"]
