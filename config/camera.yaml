# Basler line-scan acquisition settings (docs/hardware_setup.md, docs/line_requirements.md).
camera:
  model: r2L4096-14gc       # Basler racer 2 S, 4k colour line-scan, GigE
  serial: null              # pick a specific camera; null = by ip, else first found
  ip: 169.254.3.100
  lens_mm: 12               # C11-1220-12M, lens front 450 mm from bird; lights 150 mm, 15° tilt
  aperture: 5.6             # f/5.6–8 per integrator; changing it invalidates PRNU (docs/calibration.md)
  line_rate_hz: 3000.0        # square ~0.13 mm pixels at 0.40 m/s (6" pitch, 156 birds/min); max 14000
  lines_per_frame: 256      # lines per GigE frame; the stream is reassembled in software
  trigger: free_run         # free_run only — no encoder fitted yet
  exposure_us: 461.0         # null = keep camera value; must be < 1e6 / line_rate_hz
  width_px: 4096
  pixel_format: RGB8
  packet_size_bytes: 1500    # 1500 works on any NIC; 8192 (camera max) once jumbo frames are enabled on the NIC
  reverse_x: true            # integrator setup has ReverseX on

segmentation:
  # Birds overlap on the line, so there is no gap to cut on. Each bird is cut as a fixed
  # window around a predicted centre one period apart; the centre is corrected from the
  # per-line brightness profile so the cut follows small line-speed drift (free-run).
  method: periodic          # periodic (one image per bird) | tiles (bench: fixed chunks)
  birds_per_min: 156
  period_lines: null        # null = line_rate_hz * 60 / birds_per_min (~1154 at 3 kHz)
  window_factor: 1.5        # window = 1.5 periods, so overlapping neighbours stay in frame
  track_gain: 0.3           # phase correction per bird; 0 = fixed period, no tracking
  min_contrast: 2.0         # profile contrast (grey levels) below which no correction is made
  profile_sign: 1           # 1 = birds brighter than background (lights fall off behind them)
  tile_lines: 2000

storage:
  data_dir: ./data          # daily subfolders YYYYMMDD
  image_format: jpg
  jpeg_quality: 92
  rotate: true              # save birds upright (sensor line vertical → image rows)
  flip_vertical: false      # set on site once the mounting direction is known
  flip_horizontal: false
  queue_size: 16            # images waiting to be written; when full, new ones are dropped
